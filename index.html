<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>??? 자료실</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#eee;font-family:system-ui,"Malgun Gothic",sans-serif}
body{min-height:100vh;overflow:hidden}
#intro{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#280707 0%,#0b0505 48%,#000 100%);z-index:2}
#intro:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(0deg,transparent 0 3px,#aaa 4px,transparent 5px)}
.panel{position:relative;z-index:1}
.warning{color:#a22;letter-spacing:.3em;font-size:.75rem;margin-bottom:28px}
h1{font-size:clamp(2.8rem,10vw,5.5rem);letter-spacing:.16em;margin:0 0 14px;text-shadow:0 0 12px #900,0 0 30px #500}
p{color:#999;margin:0 0 34px}
button{padding:18px 44px;border:1px solid #a11;color:#f5eaea;background:linear-gradient(#350909,#100303);font-size:1.1rem;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 22px #700}
button:hover{box-shadow:0 0 36px #b00000}
#videoScreen{position:fixed;inset:0;width:100vw;height:100vh;background:#000;display:none;z-index:3}
#videoScreen.show{display:block}
#clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#soundHint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#aaa;font-size:12px;pointer-events:none;text-shadow:0 1px 4px #000}
</style>
</head>
<body>
<section id="intro">
  <div class="panel">
    <div class="warning">ACCESS RESTRICTED · 기록번호 000</div>
    <h1>자료실</h1>
    <p>기록이 존재한다는 사실을 확인하지 마십시오.</p>
    <button id="openBtn" type="button">??? 자료</button>
  </div>
</section>

<section id="videoScreen" aria-label="영상 재생 화면">
  <video id="clip" controls playsinline loop preload="auto">
    <source src="./loop-video.mp4" type="video/mp4">
    이 브라우저는 MP4 영상을 지원하지 않습니다.
  </video>
  <div id="soundHint">영상이 반복 재생됩니다 · 소리는 플레이어에서 조절할 수 있습니다</div>
</section>

<script>
const button=document.getElementById('openBtn');
const intro=document.getElementById('intro');
const screen=document.getElementById('videoScreen');
const clip=document.getElementById('clip');

button.addEventListener('click', async ()=>{
  intro.style.display='none';
  screen.classList.add('show');
  clip.volume=0.7;
  clip.muted=false;
  try {
    await clip.play();
  } catch (error) {
    // 일부 브라우저/기기 설정에서 재생이 차단되면 컨트롤을 눌러 재생 가능
    document.getElementById('soundHint').textContent='재생이 시작되지 않으면 화면의 재생 버튼을 눌러 주세요.';
    clip.controls=true;
  }
});
</script>
</body>
</html>

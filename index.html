<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>??? 자료실</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(ellipse at center, #260707 0%, #090909 55%, #000 100%);
    color: #eee; font-family: "Malgun Gothic", system-ui, sans-serif;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .12;
    background: repeating-linear-gradient(0deg, transparent 0 3px, #aaa 4px, transparent 5px);
  }
  main { width: min(760px, 92vw); text-align: center; padding: 48px 20px; }
  .warning { color: #a22; letter-spacing: .3em; font-size: .75rem; margin-bottom: 25px; }
  h1 { font-size: clamp(2.8rem, 10vw, 5.5rem); letter-spacing: .15em; margin: 0 0 12px; text-shadow: 0 0 12px #900, 0 0 30px #500; }
  p { color: #888; margin: 0 0 35px; }
  button {
    padding: 18px 42px; border: 1px solid #9a2020; color: #f5eaea;
    background: linear-gradient(#310909, #100303); font-size: 1.1rem;
    letter-spacing: .18em; cursor: pointer; box-shadow: 0 0 18px #700;
  }
  button:hover { box-shadow: 0 0 30px #b00000; }
  #player { display: none; margin-top: 35px; padding: 16px; border: 1px solid #4a1717; background: #080404; }
  #player.show { display: block; }
  video { width: 100%; max-height: 70vh; display: block; background: #000; }
  .caption { color: #a44; font-size: .8rem; margin: 0 0 12px; letter-spacing: .1em; }
  .foot { margin-top: 32px; color: #444; font-size: .7rem; letter-spacing: .15em; }
</style>
</head>
<body>
<main>
  <div class="warning">ACCESS RESTRICTED · 기록번호 000</div>
  <h1>자료실</h1>
  <p>기록이 존재한다는 사실을 확인하지 마십시오.</p>
  <button id="openBtn" type="button">??? 자료</button>
  <section id="player">
    <p class="caption">■ 미분류 영상 기록 / 반복 재생</p>
    <video id="clip" controls playsinline loop preload="metadata">
      <source src="loop-video.mp4" type="video/mp4">
      브라우저가 동영상 재생을 지원하지 않습니다.
    </video>
  </section>
  <div class="foot">UNKNOWN ARCHIVE · DO NOT DISTRIBUTE</div>
</main>
<script>
  const button = document.getElementById('openBtn');
  const player = document.getElementById('player');
  const clip = document.getElementById('clip');
  clip.volume = 0.7; // 사용자가 플레이어에서 조절 가능
  button.addEventListener('click', async () => {
    player.classList.add('show');
    button.textContent = '기록 열람 중';
    player.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try { await clip.play(); }
    catch (_) { /* 브라우저가 재생을 막으면 영상의 재생 버튼을 누르세요. */ }
  });
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>??? 자료실</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    overflow-x: hidden; color: #e8e3e3;
    font-family: "Malgun Gothic", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(92,0,0,.22), transparent 48%),
      linear-gradient(rgba(0,0,0,.82), rgba(0,0,0,.96)), #080808;
  }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.16;
    background-image: repeating-linear-gradient(0deg, transparent 0 3px, #aaa 4px, transparent 5px);
    mix-blend-mode: screen;
  }
  .wrap { width:min(760px, 92vw); text-align:center; padding:56px 22px; }
  .warning { color:#9d1717; letter-spacing:.35em; font-size:.75rem; margin-bottom:24px; }
  h1 { font-size:clamp(2.5rem, 9vw, 5.5rem); letter-spacing:.16em; margin:0 0 14px; color:#eee; text-shadow:0 0 10px #8d0000, 0 0 28px #510000; }
  .subtitle { color:#888; letter-spacing:.12em; font-size:.9rem; margin-bottom:42px; }
  .seal { display:inline-block; border:1px solid #641010; color:#b33; padding:8px 14px; font-size:.72rem; letter-spacing:.2em; margin-bottom:28px; }
  button {
    position:relative; border:1px solid #8c1717; background:linear-gradient(180deg,#260707,#100303);
    color:#f1dede; padding:18px 42px; font-size:1.1rem; letter-spacing:.18em;
    cursor:pointer; box-shadow:0 0 14px #690000, inset 0 0 18px #390000;
    transition:transform .2s, box-shadow .2s;
  }
  button::before, button::after { content:""; position:absolute; inset:-7px; border:1px solid rgba(140,20,20,.35); pointer-events:none; }
  button::after { inset:-14px; border-color:rgba(140,20,20,.16); }
  button:hover { transform:scale(1.04); box-shadow:0 0 28px #a00000, inset 0 0 22px #520000; }
  .hint { color:#555; font-size:.75rem; margin-top:24px; }
  #archive { display:none; margin:44px auto 0; text-align:left; border:1px solid #3c1717; background:rgba(8,4,4,.88); padding:18px; box-shadow:0 0 30px rgba(90,0,0,.2); }
  #archive.show { display:block; animation:appear .7s ease both; }
  .filetitle { color:#b33; letter-spacing:.12em; margin:0 0 14px; font-size:.85rem; }
  video { width:100%; max-height:70vh; display:block; background:#000; }
  #secondVideo { display:none; }
  .foot { color:#444; font-size:.7rem; letter-spacing:.12em; margin-top:36px; }
  @keyframes appear { from {opacity:0; transform:translateY(12px)} to {opacity:1; transform:translateY(0)} }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="warning">ACCESS RESTRICTED · 기록번호 000</div>
  <div class="seal">열람 주의</div>
  <h1>자료실</h1>
  <p class="subtitle">기록이 존재한다는 사실을 확인하지 마십시오.</p>
  <button id="openBtn" type="button">??? 자료</button>
  <p class="hint">잠긴 기록을 열려면 버튼을 누르십시오.</p>
  <section id="archive" aria-live="polite">
    <p class="filetitle" id="fileTitle">■ 미분류 영상 기록 / FILE_001</p>
    <video id="firstVideo" controls playsinline preload="metadata">
      <source src="Video%20Project%207%20(2).mp4" type="video/mp4">
      브라우저가 동영상 재생을 지원하지 않습니다.
    </video>
    <video id="secondVideo" controls playsinline preload="metadata" loop>
      <source src="Video%20Project%207(2)-second.mp4" type="video/mp4">
      브라우저가 동영상 재생을 지원하지 않습니다.
    </video>
  </section>
  <div class="foot">UNKNOWN ARCHIVE · DO NOT DISTRIBUTE</div>
</main>
<script>
  const button = document.getElementById('openBtn');
  const archive = document.getElementById('archive');
  const first = document.getElementById('firstVideo');
  const second = document.getElementById('secondVideo');
  const title = document.getElementById('fileTitle');

  // Keep playback at a comfortable default; the viewer can adjust it in the controls.
  first.volume = 0.6;
  second.volume = 0.6;

  button.addEventListener('click', async () => {
    archive.classList.add('show');
    button.textContent = '기록 열람 중';
    archive.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try { await first.play(); }
    catch (_) { title.textContent = '■ 재생 버튼을 눌러 첫 번째 영상을 시작하세요 / FILE_001'; }
  });

  first.addEventListener('ended', async () => {
    first.pause();
    first.style.display = 'none';
    second.style.display = 'block';
    title.textContent = '■ 반복 재생 기록 / FILE_002';
    second.currentTime = 0;
    try { await second.play(); }
    catch (_) { title.textContent = '■ 두 번째 영상의 재생 버튼을 눌러 시작하세요 / FILE_002'; }
  });
</script>
</body>
</html>
